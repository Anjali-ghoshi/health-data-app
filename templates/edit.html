<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Patient</title><style>body{font-family:Arial;background:linear-gradient(to right,#ff9966,#ff5e62);text-align:center;color:white}.container{background:white;color:black;width:350px;margin:50px auto;padding:20px;border-radius:10px}input{width:90%;padding:8px;margin:5px}button{background:#ff5e62;color:white;padding:10px;border:0;width:100%;border-radius:5px}</style></head><body><div class="container"><h2>✏ Edit Patient</h2><form action="/update/{{ patient['id'] }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="name" value="{{ patient['name'] }}" required><input name="age" type="number" value="{{ patient['age'] }}" min="0" required><input name="gender" value="{{ patient['gender'] }}" required><input name="disease" value="{{ patient['disease'] }}" required><input name="recovery" type="number" value="{{ patient['recovery_days'] }}" min="0" required><button>Update</button></form><br><a href="/dashboard">⬅ Back</a></div></body></html>
