<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><style>body{font-family:Arial;background:linear-gradient(to right,#667eea,#764ba2);color:white;text-align:center}.container{width:90%;margin:auto}.card{display:inline-block;background:white;color:black;padding:15px;margin:10px;border-radius:10px;width:150px}table{width:100%;margin-top:20px;border-collapse:collapse;background:white;color:black}th{background:#4facfe;color:white;padding:10px}td{padding:8px;border-bottom:1px solid #ddd}.btn{background:#4facfe;padding:10px 15px;border-radius:5px;color:white;margin:10px;display:inline-block;text-decoration:none}.edit-btn{color:green}.delete-btn{color:red}.inline{display:inline}.logout{margin:15px;padding:8px}</style></head><body><div class="container"><h2>📊 Health Dashboard</h2><p>Logged in as {{ session['user_email'] }}</p><div class="card">Total Patients<br><b>{{ total }}</b></div><table><tr><th>Name</th><th>Age</th><th>Gender</th><th>Disease</th><th>Recovery Days</th><th>Action</th></tr>{% for row in data %}<tr><td>{{ row['name'] }}</td><td>{{ row['age'] }}</td><td>{{ row['gender'] }}</td><td>{{ row['disease'] }}</td><td>{{ row['recovery_days'] }}</td><td><a href="/edit/{{ row['id'] }}" class="edit-btn">✏ Edit</a><form action="/delete/{{ row['id'] }}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="delete-btn" type="submit">🗑 Delete</button></form></td></tr>{% endfor %}</table><br><a href="/" class="btn">➕ Add Patient</a><a href="/chart" class="btn">📊 View Chart</a><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="logout" type="submit">Logout</button></form></div></body></html>
