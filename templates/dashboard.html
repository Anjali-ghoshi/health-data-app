<!DOCTYPE html> 
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        h2 {
            margin-top: 20px;
        }

        .card {
            display: inline-block;
            background: white;
            color: black;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            width: 150px;
            box-shadow: 0px 0px 10px gray;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
            color: black;
        }

        th {
            background: #4facfe;
            color: white;
            padding: 10px;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f1f1;
        }

        a {
            text-decoration: none;
            font-weight: bold;
        }

        .btn {
            background: #4facfe;
            padding: 10px 15px;
            border-radius: 5px;
            color: white;
            margin: 10px;
            display: inline-block;
        }

        .edit-btn {
            color: green;
        }

        .delete-btn {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📊 Health Dashboard</h2>

    <!-- Stats Card -->
    <div class="card">
        Total Patients<br>
        <b>{{ data|length }}</b>
    </div>

    <!-- Table -->
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Disease</th>
            <th>Recovery Days</th>
            <th>Action</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
            <td>
                <a href="/edit/{{ row[0] }}" class="edit-btn">✏ Edit</a> |
                <a href="/delete/{{ row[0] }}" class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete?')">
                   🗑 Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <a href="/" class="btn">➕ Add Patient</a>
    <a href="/chart" class="btn">📊 View Chart</a>

</div>

</body>
</html>
