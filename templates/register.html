<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><style>body{font-family:Arial;background:linear-gradient(to right,#4facfe,#00f2fe);text-align:center}.box{background:white;width:350px;margin:60px auto;padding:25px;border-radius:10px}input{width:90%;padding:10px;margin:7px}button{width:96%;padding:10px;background:#4facfe;color:white;border:0;border-radius:5px}.msg{color:#c00}</style></head><body><div class="box"><h2>👤 Create Account</h2>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required><input type="password" name="confirm_password" placeholder="Confirm password" minlength="8" required><button type="submit">Register</button></form><p>Already registered? <a href="/login">Login</a></p></div></body></html>
