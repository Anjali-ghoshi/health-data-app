<!DOCTYPE html>
<html>
<head>
    <title>Health Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            color: white;
            text-align: center;
        }

        h2 {
            margin-top: 20px;
        }

        .container {
            width: 95%;
            margin: auto;
        }

        .charts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chart-box {
            background: white;
            color: black;
            padding: 15px;
            margin: 15px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        .chart-box h3 {
            margin-bottom: 10px;
        }

        img {
            width: 100%;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📊 Health Data Analytics Dashboard</h2>

    <div class="charts">

        <div class="chart-box">
            <h3>📌 Disease Distribution</h3>
            <img src="/static/chart1.png">
        </div>

        <div class="chart-box">
            <h3>👥 Gender Distribution</h3>
            <img src="/static/chart2.png">
        </div>

        <div class="chart-box">
            <h3>⏱ Recovery Days Analysis</h3>
            <img src="/static/chart3.png">
        </div>

    </div>

    <a href="/dashboard" class="btn">⬅ Back to Dashboard</a>

</div>

</body>
</html>
