<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Data App</title><style>body{font-family:Arial;background:linear-gradient(to right,#4facfe,#00f2fe);text-align:center}.container{background:white;width:350px;margin:50px auto;padding:20px;border-radius:10px;box-shadow:0 0 10px gray}input{width:90%;padding:8px;margin:5px}button{background:#4facfe;color:white;border:0;padding:10px;width:100%;border-radius:5px}a{display:block;margin-top:10px}.msg{color:green}</style></head><body><div class="container"><h2>🏥 Health Data Entry</h2><p>Logged in as {{ session['user_email'] }}</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}{% endwith %}<form action="/add" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="text" name="name" placeholder="Name" required><input type="number" name="age" placeholder="Age" min="0" required><input type="text" name="gender" placeholder="Gender" required><input type="text" name="disease" placeholder="Disease" required><input type="number" name="recovery" placeholder="Recovery Days" min="0" required><button type="submit">Add Patient</button></form><a href="/dashboard">View Dashboard</a><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">Logout</button></form></div></body></html>
