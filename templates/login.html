<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>body{font-family:Arial;background:linear-gradient(to right,#667eea,#764ba2);text-align:center}.box{background:white;width:350px;margin:70px auto;padding:25px;border-radius:10px}input{width:90%;padding:10px;margin:7px}button{width:96%;padding:10px;background:#667eea;color:white;border:0;border-radius:5px}.msg{color:#c00}</style></head>
<body><div class="box"><h2>🔐 Health Data Login</h2>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><button type="submit">Login</button></form><p>New user? <a href="/register">Create account</a></p></div></body></html>
